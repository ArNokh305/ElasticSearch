services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: docsearch_test
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: docsearch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  tests:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://docsearch:docsearch@postgres-test:5432/docsearch_test
      ELASTICSEARCH_URL: http://elasticsearch-test:9200
      ES_INDEX_NAME: documents_test
      SEARCH_OVERFETCH_SIZE: "50"
    depends_on:
      postgres-test:
        condition: service_healthy
      elasticsearch-test:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-v"]
